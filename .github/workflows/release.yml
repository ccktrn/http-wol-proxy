name: Release Go Binary

on:
  push:
    tags:
      - "v*.*.*" # 例: v1.0.0 のようなタグがプッシュされたら実行される

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    # 権限設定: Releasesにファイルをアップロードするために必要
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # 必要なGoのバージョン

      - name: Build Binary (Linux AMD64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o pve-wol ./src

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: pve-wol
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
